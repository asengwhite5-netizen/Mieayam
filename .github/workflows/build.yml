name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip source
        run: unzip -q MieAyamClient-1.21.11.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Build
        working-directory: MieAyamClient
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: MieAyamClient-jar
          path: MieAyamClient/build/libs/*.jar
